<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esteria Chat</title>
  <link rel="stylesheet" href="./chat.css" />
</head>
<body>
  <div class="chat-app">
    <header class="chat-top">
      <button id="backButton" type="button" class="ghost" hidden aria-label="Back">‹</button>
      <div class="chat-title">
        <strong id="chatHeading">Chats</strong>
        <small id="chatStatus">Connecting…</small>
      </div>
      <button id="newGroupButton" type="button" class="ghost" aria-label="New group" title="New group chat">＋</button>
      <button id="refreshButton" type="button" class="ghost" aria-label="Refresh" title="Refresh">⟳</button>
    </header>

    <section id="threadList" class="thread-list"></section>
    <div class="chat-options">
      <button id="linkAccountButton" type="button">Game accounts</button>
      <label><input id="autoplayInput" type="checkbox" /> Autoplay GIFs</label>
      <label id="privacyLabel" hidden><input id="privacyInput" type="checkbox" /> Share character</label>
    </div>

    <section id="conversation" class="conversation" hidden>
      <div id="messageList" class="message-list"></div>
      <button id="olderButton" type="button">Load older messages</button>
      <div id="pendingAttachments" aria-live="polite"></div>
      <form id="composer" class="composer">
        <button id="attachButton" type="button" aria-label="Attach images">+</button>
        <input id="attachmentInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden />
        <input id="messageInput" type="text" maxlength="1000" placeholder="Message" autocomplete="off" />
        <button type="submit" id="sendButton">Send</button>
      </form>
    </section>

    <div id="emptyState" class="empty" hidden></div>
  </div>

  <div class="dialog-backdrop" id="groupBackdrop" hidden>
    <section class="dialog">
      <h2>New group chat</h2>
      <label for="groupNameInput">Group name</label>
      <input id="groupNameInput" type="text" maxlength="40" placeholder="Weekend raid" autocomplete="off" />
      <p class="hint">Pick the friends to include.</p>
      <div id="groupFriendList" class="group-friends"></div>
      <div class="dialog-actions">
        <button id="cancelGroupButton" type="button" class="ghost">Cancel</button>
        <button id="createGroupButton" type="button" class="primary">Create group</button>
      </div>
    </section>
  </div>

  <div id="linkBackdrop" class="dialog-backdrop" hidden>
    <section class="dialog" aria-label="Link game account">
      <h2>Game accounts</h2>
      <p id="linkInstructions">Create a code, enter /ec link CODE in game, then confirm the identities here.</p>
      <button id="createLinkButton" type="button">Create link code</button>
      <pre id="linkCode"></pre>
      <div id="linkedAccounts"></div>
      <div class="dialog-actions"><button id="closeLinkButton" type="button">Close</button></div>
    </section>
  </div>
  <div id="reportBackdrop" class="dialog-backdrop" hidden>
    <section class="dialog" aria-label="Report message">
      <h2>Report message</h2>
      <label for="reportReason">Reason</label>
      <input id="reportReason" maxlength="500" autocomplete="off" />
      <div class="dialog-actions">
        <button id="cancelReportButton" type="button">Cancel</button>
        <button id="sendReportButton" type="button">Report</button>
      </div>
    </section>
  </div>
  <script src="./chat-media.js"></script>
  <script src="./chat.js"></script>
</body>
</html>
